openapi: 3.0.3

info:
  title: Atom HTTP API
  version: 1.0.0
  description: |
    Frozen v1 HTTP transport contract for Atom.

    Administrative and domain operations are exposed through `POST /graphql`;
    the remaining HTTP routes are limited to authentication, health, JWKS,
    public PKI artifacts, and configured custom endpoint execution. Atom also
    exposes a separately versioned gRPC API described by
    `proto/atom/v1/atom.proto`.

    Authenticated requests accept an ES256 JWT or Atom access token in the
    `Authorization: Bearer <token>` header. The GraphQL and session routes also
    accept the `atom_token` HttpOnly cookie. Cookie-authenticated unsafe
    requests require a trusted Origin or Referer.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: The Atom deployment origin

tags:
  - name: Health
    description: Process liveness, dependency readiness, and metrics
  - name: Authentication
    description: Identity bootstrap, login, OAuth, sessions, and signing keys
  - name: GraphQL
    description: Domain and administrative GraphQL operations
  - name: PKI artifacts
    description: Public trust, CRL, and OCSP publication endpoints
  - name: Custom endpoints
    description: Operator-configured REST projections over GraphQL

security: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: legacyHealth
      summary: Readiness-compatible legacy health endpoint
      responses:
        "200":
          description: Atom is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "503":
          description: At least one required component is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /health/live:
    get:
      tags: [Health]
      operationId: live
      summary: Process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"

  /health/ready:
    get:
      tags: [Health]
      operationId: ready
      summary: Dependency readiness
      responses:
        "200":
          description: Atom is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "503":
          description: At least one required component is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /metrics:
    get:
      tags: [Health]
      operationId: metrics
      summary: Prometheus metrics when metrics are enabled
      description: This optional unauthenticated route must be network-restricted.
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled or unavailable in this build

  /.well-known/jwks.json:
    get:
      tags: [Authentication]
      operationId: jwks
      summary: Active ES256 verification keys
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

  /auth/public-config:
    get:
      tags: [Authentication]
      operationId: publicAuthConfig
      summary: Public authentication configuration
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuthConfig"

  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Register a human identity when self-registration is enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Signup accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with a password or shared key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; also sets the `atom_token` HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/email/verify:
    get:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Consume an email-verification token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [verified]
                properties:
                  verified:
                    type: boolean
                    enum: [true]
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/email/resend:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Request another verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Request accepted whether or not the email exists
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/password/reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset email
      description: |
        The body contains only the account email. Atom always builds the reset
        link from `ATOM_PASSWORD_RESET_REDIRECT`; caller-controlled redirect
        fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Request accepted whether or not the email exists
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Consume a reset token and replace the password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password reset; existing sessions and credentials are revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/oauth/{provider}/start:
    get:
      tags: [Authentication]
      operationId: oauthStart
      summary: Start an enabled OIDC authorization flow
      parameters:
        - $ref: "#/components/parameters/OauthProvider"
        - name: return_to
          in: query
          required: false
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the provider authorization endpoint
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/oauth/{provider}/callback:
    get:
      tags: [Authentication]
      operationId: oauthCallback
      summary: Complete an OIDC provider callback
      parameters:
        - $ref: "#/components/parameters/OauthProvider"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "307":
          description: Redirect to the configured success or error callback
          headers:
            Location:
              schema:
                type: string
                format: uri

  /auth/oauth/exchange:
    post:
      tags: [Authentication]
      operationId: oauthExchange
      summary: Exchange a one-time OAuth result code for an Atom session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthExchangeRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session and clear the auth cookie
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                    enum: [false]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/introspect:
    get:
      tags: [Authentication]
      operationId: introspect
      summary: Return the authenticated token identity
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Active authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/session:
    get:
      tags: [Authentication]
      operationId: currentSession
      summary: Return the current authentication session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sessions/{id}:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Read a session visible to the caller
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidId"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/keys/rotate:
    post:
      tags: [Authentication]
      operationId: rotateSigningKeys
      summary: Rotate ES256 signing keys
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Keys rotated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /graphql:
    post:
      tags: [GraphQL]
      operationId: graphql
      summary: Execute a GraphQL operation
      description: |
        Authentication is optional at the transport boundary because a small
        set of GraphQL fields is public. Protected fields enforce authorization
        in their resolvers. The frozen GraphQL type-system contract is committed
        separately as `apidocs/graphql-schema.graphql`.
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQLRequest"
      responses:
        "200":
          description: GraphQL response; resolver failures appear in `errors`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQLResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /certs/trust-bundle.pem:
    get:
      tags: [PKI artifacts]
      operationId: trustBundle
      summary: Active and retained CA trust bundle
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: PEM trust bundle
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/x-pem-file:
              schema:
                type: string
        "304":
          description: Cached representation remains current

  /certs/issuers/{issuer_id}/crl:
    get:
      tags: [PKI artifacts]
      operationId: issuerCrl
      summary: Issuer-specific X.509 certificate revocation list
      parameters:
        - $ref: "#/components/parameters/IssuerId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: DER-encoded CRL
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/pkix-crl:
              schema:
                type: string
                format: binary
        "304":
          description: Cached representation remains current
        "404":
          $ref: "#/components/responses/NotFound"

  /certs/issuers/{issuer_id}/ocsp:
    post:
      tags: [PKI artifacts]
      operationId: issuerOcsp
      summary: Issuer-specific OCSP responder
      parameters:
        - $ref: "#/components/parameters/IssuerId"
      requestBody:
        required: true
        content:
          application/ocsp-request:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: DER-encoded OCSP response, including protocol-level error responses
          content:
            application/ocsp-response:
              schema:
                type: string
                format: binary

  /api/custom/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: Configured custom endpoint path, including nested segments
        schema:
          type: string
    get:
      tags: [Custom endpoints]
      operationId: executeCustomEndpointGet
      summary: Execute a configured GET custom endpoint
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/CustomEndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Custom endpoints]
      operationId: executeCustomEndpointPost
      summary: Execute a configured POST custom endpoint
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CustomEndpointBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomEndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Custom endpoints]
      operationId: executeCustomEndpointPut
      summary: Execute a configured PUT custom endpoint
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CustomEndpointBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomEndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Custom endpoints]
      operationId: executeCustomEndpointPatch
      summary: Execute a configured PATCH custom endpoint
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CustomEndpointBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomEndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Custom endpoints]
      operationId: executeCustomEndpointDelete
      summary: Execute a configured DELETE custom endpoint
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CustomEndpointBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomEndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or atom access token
    cookieAuth:
      type: apiKey
      in: cookie
      name: atom_token

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssuerId:
      name: issuer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OauthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated caller lacks permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request exceeds the configured body limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: JSON body does not match the frozen request DTO
      content:
        text/plain:
          schema:
            type: string
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomEndpointResponse:
      description: Configured JSON response
      content:
        application/json:
          schema: {}

  requestBodies:
    CustomEndpointBody:
      required: false
      content:
        application/json:
          schema: {}

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    LiveStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ComponentStatus:
      type: string
      enum: [ok, disabled, degraded, error]

    ComponentCheck:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          $ref: "#/components/schemas/ComponentStatus"
        message:
          type: string

    DbPoolStatus:
      type: object
      additionalProperties: false
      required: [max_connections, min_connections, acquire_timeout_secs, connect_timeout_secs, idle_timeout_secs, max_lifetime_secs, size, idle]
      properties:
        max_connections: { type: integer, minimum: 0 }
        min_connections: { type: integer, minimum: 0 }
        acquire_timeout_secs: { type: integer, minimum: 0 }
        connect_timeout_secs: { type: integer, minimum: 0 }
        idle_timeout_secs: { type: integer, minimum: 0 }
        max_lifetime_secs: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 0 }
        idle: { type: integer, minimum: 0 }

    SigningKeyStatus:
      type: object
      additionalProperties: false
      required: [configured_key_id, encrypted_count, plaintext_count, total_count, plaintext_allowed]
      properties:
        configured_key_id: { type: string }
        encrypted_count: { type: integer }
        plaintext_count: { type: integer }
        total_count: { type: integer }
        plaintext_allowed: { type: boolean }

    AuditRetentionStatus:
      type: object
      additionalProperties: false
      required: [enabled, days, cleanup_interval_secs, cleanup_batch_size, last_cleanup]
      properties:
        enabled: { type: boolean }
        days: { type: integer }
        cleanup_interval_secs: { type: integer, minimum: 0 }
        cleanup_batch_size: { type: integer }
        last_cleanup:
          type: object
          nullable: true

    RateLimitPolicyStatus:
      type: object
      additionalProperties: false
      required: [category, max_requests, window_secs]
      properties:
        category:
          type: string
          enum: [auth_routes, public_routes, enrollment, graphql, custom_endpoints, admin_routes]
        max_requests: { type: integer, minimum: 0 }
        window_secs: { type: integer, minimum: 0 }

    RateLimitStatus:
      type: object
      additionalProperties: false
      required: [enabled, policies, trusted_proxy_cidrs]
      properties:
        enabled: { type: boolean }
        policies:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitPolicyStatus"
        trusted_proxy_cidrs:
          type: array
          items: { type: string }

    SystemStatus:
      type: object
      additionalProperties: false
      required: [status, http_ready, grpc_ready, database, migrations, signing_keys, certificate_issuer, db_pool, signing_key_state, audit_retention, rate_limits]
      properties:
        status:
          $ref: "#/components/schemas/ComponentStatus"
        http_ready:
          $ref: "#/components/schemas/ComponentCheck"
        grpc_ready:
          $ref: "#/components/schemas/ComponentCheck"
        database:
          $ref: "#/components/schemas/ComponentCheck"
        migrations:
          $ref: "#/components/schemas/ComponentCheck"
        signing_keys:
          $ref: "#/components/schemas/ComponentCheck"
        certificate_issuer:
          $ref: "#/components/schemas/ComponentCheck"
        db_pool:
          $ref: "#/components/schemas/DbPoolStatus"
        signing_key_state:
          type: object
          allOf:
            - $ref: "#/components/schemas/SigningKeyStatus"
          nullable: true
        audit_retention:
          $ref: "#/components/schemas/AuditRetentionStatus"
        rate_limits:
          $ref: "#/components/schemas/RateLimitStatus"

    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"

    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y, kid, use, alg]
      properties:
        kty: { type: string, enum: [EC] }
        crv: { type: string, enum: [P-256] }
        x: { type: string }
        y: { type: string }
        kid: { type: string }
        use: { type: string, enum: [sig] }
        alg: { type: string, enum: [ES256] }

    PublicAuthConfig:
      type: object
      additionalProperties: false
      required: [signup_enabled, self_registration_enabled, oauth_providers, email_verification_required, dev_allow_unverified_email_login]
      properties:
        signup_enabled: { type: boolean }
        self_registration_enabled: { type: boolean }
        oauth_providers:
          type: array
          items: { type: string }
        email_verification_required: { type: boolean }
        dev_allow_unverified_email_login: { type: boolean }

    LoginRequest:
      type: object
      required: [identifier, secret]
      properties:
        identifier: { type: string }
        secret: { type: string, format: password }
        tenant_id: { type: string, format: uuid, nullable: true }
        tenant_alias: { type: string, nullable: true }
        kind:
          type: string
          enum: [password, shared_key]
          default: password

    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, entity_id, session_id, expires_at, verification_required]
      properties:
        token: { type: string }
        entity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
