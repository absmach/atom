	"""
	restoreRole(id: ID!): Boolean!
	"""
	Physically purge an already-soft-deleted role, bypassing the retention
	window. GCs permission blocks left orphaned by the removal. Deliberate,
	irreversible, platform-admin only, and audit-logged.
	"""
	purgeRole(id: ID!): Boolean!
	createAction(input: CreateActionInput!): Action!
	addActionApplicability(input: AddActionApplicabilityInput!): ActionApplicabilityEntry!
	removeActionApplicability(input: RemoveActionApplicabilityInput!): Boolean!
	createActionAssignmentRule(input: CreateActionAssignmentRuleInput!): ActionAssignmentRule!
