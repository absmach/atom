type MutationRoot {
	login(input: LoginInput!): LoginResponse!
	signup(input: SignupInput!): SignupResponse!
	logout: Boolean!
	refreshSession: LoginResponse!
	createTenant(input: CreateTenantInput!): Tenant!
	updateTenant(id: ID!, input: UpdateTenantInput!): Tenant!
	deleteTenant(id: ID!): Boolean!
	"""
	Restore a soft-deleted tenant within the retention window. Reactivates the
	tenant and un-hides its children automatically; revoked sessions and
	certificates are not reinstated, so members must re-authenticate.
	Admin-only and audit-logged.
	"""
	restoreTenant(id: ID!): Tenant!
	"""
	Physically purge an already-soft-deleted tenant and all its data,
	bypassing the purge retention window. Deliberate, irreversible, admin-only.
	"""
	purgeTenant(id: ID!): Boolean!
	enableTenant(id: ID!): Tenant!
	disableTenant(id: ID!): Tenant!
	freezeTenant(id: ID!): Tenant!
	createTenantInvitation(tenantId: ID!, input: CreateTenantInvitationInput!): TenantInvitation!
	acceptTenantInvitation(tenantId: ID!): Boolean!
	acceptTenantInvitationToken(input: InvitationTokenInput!): ID!
	rejectTenantInvitation(tenantId: ID!): Boolean!
	revokeTenantInvitation(tenantId: ID!, invitationId: ID!): Boolean!
	removeTenantMember(tenantId: ID!, entityId: ID!): Boolean!
	addTenantMember(tenantId: ID!, entityId: ID!, roleId: ID): Boolean!
	createProfile(input: CreateProfileInput!): Profile!
	createProfileVersion(profileId: ID!, input: CreateProfileVersionInput!): ProfileVersion!
	updateProfile(id: ID!, input: UpdateProfileInput!): Profile!
	updateProfileVersion(id: ID!, input: UpdateProfileVersionInput!): ProfileVersion!
	createEntity(input: CreateEntityInput!): Entity!
	updateEntity(id: ID!, input: UpdateEntityInput!): Entity!
	deleteEntity(id: ID!): Boolean!
	"""
	Restore a soft-deleted entity while it is still within the purge
	retention window. Reinstates the identity (and frees the access it
	carried), so it is platform-admin-only and audit-logged. Revoked
	credentials and sessions are not reinstated — the entity must
	re-authenticate.
	"""
	restoreEntity(id: ID!): Boolean!
	"""
	Physically purge an already-soft-deleted entity, bypassing the retention
	window. Deliberate, irreversible, platform-admin only, and audit-logged.
	"""
	purgeEntity(id: ID!): Boolean!
	"""
	Add the entity to an object group. Membership is many-to-many, so this
	adds to the set rather than replacing it, and re-adding an existing
	membership is an idempotent no-op.
	"""
	addEntityToObjectGroup(entityId: ID!, objectGroupId: ID!): Entity!
	"""
	Remove the entity from **one** object group; its other memberships, and
	the grants that flow through them, are untouched.
	"""
	removeEntityFromObjectGroup(entityId: ID!, objectGroupId: ID!): Entity!
	"""
	Remove the entity from **every** object group it belongs to. Kept
	distinct from `removeEntityFromObjectGroup` so "clear the group" can
	never be read as either one by accident.
	"""
	clearEntityObjectGroups(entityId: ID!): Entity!
	enableEntity(id: ID!): Entity!
	disableEntity(id: ID!): Entity!
	addOwnership(ownerId: ID!, ownedId: ID!, relation: String): Ownership!
	removeOwnership(ownerId: ID!, ownedId: ID!): Boolean!
	createResource(input: CreateResourceInput!): Resource!
	updateResource(id: ID!, input: UpdateResourceInput!): Resource!
	deleteResource(id: ID!): Boolean!
	"""
	Restore a soft-deleted resource within the retention window. Platform-admin
	only and audit-logged.
	"""
	restoreResource(id: ID!): Boolean!
	"""
	Physically purge an already-soft-deleted resource, bypassing the retention
	window. Deliberate, irreversible, platform-admin only, and audit-logged.
	"""
	purgeResource(id: ID!): Boolean!
	"""
	Add the resource to an object group. Membership is many-to-many, so this
	adds to the set rather than replacing it, and re-adding an existing
	membership is an idempotent no-op.
	"""
	addResourceToObjectGroup(resourceId: ID!, objectGroupId: ID!): Resource!
	"""
	Remove the resource from **one** object group; its other memberships,
	and the grants that flow through them, are untouched.
	"""
	removeResourceFromObjectGroup(resourceId: ID!, objectGroupId: ID!): Resource!
	"""
	Remove the resource from **every** object group it belongs to. Kept
	distinct from `removeResourceFromObjectGroup` so "clear the group" can
	never be read as either one by accident.
	"""
	clearResourceObjectGroups(resourceId: ID!): Resource!
	createApiEndpoint(input: CreateApiEndpointInput!): ApiEndpoint!
	updateApiEndpoint(id: ID!, input: UpdateApiEndpointInput!): ApiEndpoint!
	enableApiEndpoint(id: ID!): ApiEndpoint!
	disableApiEndpoint(id: ID!): ApiEndpoint!
	createGroup(input: CreateGroupInput!): Group!
	createObjectGroup(input: CreateGroupInput!): Group!
	createPrincipalGroup(input: CreateGroupInput!): Group!
	updateGroup(id: ID!, input: UpdateGroupInput!): Group!
	enableGroup(id: ID!): Group!
	disableGroup(id: ID!): Group!
	suspendGroup(id: ID!): Group!
	setGroupParent(id: ID!, parentId: ID!): Group!
	setObjectGroupParent(objectGroupId: ID!, parentGroupId: ID!): Group!
	removeGroupParent(id: ID!): Boolean!
	removeObjectGroupParent(objectGroupId: ID!): Boolean!
	deleteGroup(id: ID!): Boolean!
	"""
	Restore a soft-deleted group within the retention window. Platform-admin
	only and audit-logged, since restoring a group reinstates the membership
	paths and grants that flowed through it.
	"""
	restoreGroup(id: ID!): Boolean!
	"""
	Physically purge an already-soft-deleted group, bypassing the retention
	window. Deliberate, irreversible, platform-admin only, and audit-logged.
	"""
	purgeGroup(id: ID!): Boolean!
	addGroupMember(groupId: ID!, entityId: ID!): Boolean!
	removeGroupMember(groupId: ID!, entityId: ID!): Boolean!
	changeOwnPassword(currentPassword: String!, newPassword: String!): Boolean!
	createPassword(entityId: ID!, password: String!): Boolean!
	createAccessToken(input: CreateAccessTokenInput!): AccessTokenResponse!
	replaceAccessTokenPermissions(credentialId: ID!, permissions: [AccessTokenPermissionInput!]!): Boolean!
	revokeAccessToken(credentialId: ID!): Boolean!
	createSharedKey(entityId: ID!, input: CreateSharedKeyInput!): SharedKeyResponse!
	revealSharedKey(entityId: ID!, credentialId: ID!): SharedKeyResponse!
	revokeCredential(entityId: ID!, credentialId: ID!): Boolean!
	"""
	Managed one-time key bootstrap.
	"""
	issueGeneratedCertificateV2(input: IssueGeneratedCertificateV2Input!): IssuedCertificate!
	"""
	Managed-issuer CSR issuance.
	"""
	issueCertificateFromCsrV2(input: IssueCertificateFromCsrV2Input!): IssuedCertificate!
	"""
	Exact-credential managed renewal using a subject-owned CSR.
	"""
	renewCertificateFromCsrV2(input: RenewCertificateFromCsrV2Input!): IssuedCertificate!
	"""
	Exact-credential managed renewal with a new one-time private key.
	"""
	renewGeneratedCertificateV2(input: RenewGeneratedCertificateV2Input!): IssuedCertificate!
	"""
	Issuer-aware revocation by exact credential, fingerprint, or issuer and serial.
	"""
	revokeCertificateV2(input: RevokeCertificateV2Input!): CertificateRevocation!
	revokeEntityCertificates(entityId: ID!, reason: String): Int!
	"""
	Bounded, UUID-cursor fleet revocation by exactly one generic selector.
