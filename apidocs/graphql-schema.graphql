	updateAction(id: ID!, input: UpdateActionInput!): Action!
	deleteAction(id: ID!): Boolean!
	createPermissionBlock(input: CreatePermissionBlockInput!): PermissionBlock!
	deletePermissionBlock(id: ID!): Boolean!
	createRoleAssignment(input: CreateRoleAssignmentInput!): RoleAssignment!
	deleteRoleAssignment(id: ID!): Boolean!
	createDirectPolicy(input: CreateDirectPolicyInput!): DirectPolicy!
	deleteDirectPolicy(id: ID!): Boolean!
