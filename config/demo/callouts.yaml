# Atom callout configuration — demo for docker compose.
#
# Loaded by atom when ATOM_CALLOUTS_FILE points at it. Kill-switch:
# ATOM_CALLOUTS_ENABLED=false. Both are set in docker-compose.yml so a fresh
# `docker compose up` has this working out of the box.
#
# The endpoint `local-echo` targets the `callout-server` container defined in
# docker-compose.yml — it always returns ALLOW and prints every request to
# its stdout (see `examples/callouts/server.py`). Watch it with:
#
#   docker compose logs -f callout-server

callouts:
  endpoints:
    - id: local-echo
      transport: http
      url: http://callout-server:9099/callout
      method: POST
      timeout_ms: 2000
      on_error: deny        # atom's default-deny invariant

  operations:
    # Fires on every GraphQL createEntity mutation.
    # `args.input.kind` is the entity kind the caller is trying to create
    # (device / human / service / workload / application).
    - name: createEntity
      surface: graphql
      endpoints: [local-echo]
      include:
        - actor.entity_id
        - actor.tenant_id
        - args.input.name
        - args.input.kind
      extra:
        entity_type: entity     # static category label, merged into envelope.extra

    # Fires on every GraphQL deleteEntity mutation.
    # The GraphQL input is just `id`, but the callout extension enriches the
    # envelope with the target entity's `kind` (looked up by id) before
    # dispatch, so policy can gate on device/human/service without a
    # round-trip to the Atom API. Enrichment is best-effort: if the lookup
    # fails the callout still runs and args.kind is simply absent.
    - name: deleteEntity
      surface: graphql
      endpoints: [local-echo]
      include:
        - actor.entity_id
        - args.id
        - args.kind
      extra:
        entity_type: entity
