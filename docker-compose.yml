services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atom}
      PGPORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -p ${POSTGRES_PORT:-5432}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  atom:
    image: ${ATOM_IMAGE:-ghcr.io/absmach/atom:latest}
    build:
      context: .
      target: release
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the demo callout server so a fresh `docker compose up` has
      # createEntity / deleteEntity mutations routed through it out of the
      # box (see ATOM_CALLOUTS_* below). Flip ATOM_CALLOUTS_ENABLED=false to
      # kill-switch without removing the wiring.
      callout-server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-atom}
      LISTEN_ADDR: 0.0.0.0:${ATOM_HTTP_PORT:-8080}
      GRPC_ADDR: 0.0.0.0:${ATOM_GRPC_PORT:-8081}
      ATOM_DB_MAX_CONNECTIONS: ${ATOM_DB_MAX_CONNECTIONS:-20}
      ATOM_DB_MIN_CONNECTIONS: ${ATOM_DB_MIN_CONNECTIONS:-0}
      ATOM_DB_ACQUIRE_TIMEOUT_SECS: ${ATOM_DB_ACQUIRE_TIMEOUT_SECS:-30}
      ATOM_DB_CONNECT_TIMEOUT_SECS: ${ATOM_DB_CONNECT_TIMEOUT_SECS:-10}
      ATOM_DB_IDLE_TIMEOUT_SECS: ${ATOM_DB_IDLE_TIMEOUT_SECS:-600}
      ATOM_DB_MAX_LIFETIME_SECS: ${ATOM_DB_MAX_LIFETIME_SECS:-1800}
      JWT_EXPIRY_SECS: 3600
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET}
      ATOM_KEY_ENCRYPTION_KEY: ${ATOM_KEY_ENCRYPTION_KEY:?set ATOM_KEY_ENCRYPTION_KEY}
      ATOM_KEY_ENCRYPTION_KEY_ID: ${ATOM_KEY_ENCRYPTION_KEY_ID:-local:v1}
      ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS: ${ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS:-false}
      ATOM_AUDIT_RETENTION_DAYS: ${ATOM_AUDIT_RETENTION_DAYS:-365}
      ATOM_AUDIT_RETENTION_ENABLED: ${ATOM_AUDIT_RETENTION_ENABLED:-true}
      ATOM_AUDIT_CLEANUP_INTERVAL_SECS: ${ATOM_AUDIT_CLEANUP_INTERVAL_SECS:-86400}
      ATOM_AUDIT_CLEANUP_BATCH_SIZE: ${ATOM_AUDIT_CLEANUP_BATCH_SIZE:-5000}
      ATOM_AUDIT_HOT_PATH_ALLOW_DB_ENABLED: ${ATOM_AUDIT_HOT_PATH_ALLOW_DB_ENABLED:-false}
      ATOM_EVENTS_AMQP_URL: ${ATOM_EVENTS_AMQP_URL:-}
      ATOM_EVENTS_AMQP_EXCHANGE: ${ATOM_EVENTS_AMQP_EXCHANGE:-}
      ATOM_EVENTS_AMQP_ROUTING_KEY: ${ATOM_EVENTS_AMQP_ROUTING_KEY:-atom.events}
      ATOM_EVENTS_AMQP_TLS_CLIENT_CERT_PATH: ${ATOM_EVENTS_AMQP_TLS_CLIENT_CERT_PATH:-}
      ATOM_EVENTS_AMQP_TLS_CLIENT_KEY_PATH: ${ATOM_EVENTS_AMQP_TLS_CLIENT_KEY_PATH:-}
      ATOM_EVENTS_AMQP_TLS_CA_PATH: ${ATOM_EVENTS_AMQP_TLS_CA_PATH:-}
      ATOM_EVENTS_OUTBOX_POLL_INTERVAL_SECS: ${ATOM_EVENTS_OUTBOX_POLL_INTERVAL_SECS:-5}
      ATOM_EVENTS_OUTBOX_BATCH_SIZE: ${ATOM_EVENTS_OUTBOX_BATCH_SIZE:-100}
      ATOM_EVENTS_OUTBOX_MAX_ATTEMPTS: ${ATOM_EVENTS_OUTBOX_MAX_ATTEMPTS:-10}
      ATOM_EVENTS_PUBLISH_TIMEOUT_SECS: ${ATOM_EVENTS_PUBLISH_TIMEOUT_SECS:-30}
      ATOM_LOGIN_FAILURE_LIMIT: ${ATOM_LOGIN_FAILURE_LIMIT:-5}
      ATOM_LOGIN_FAILURE_WINDOW_SECS: ${ATOM_LOGIN_FAILURE_WINDOW_SECS:-900}
      ATOM_TRUSTED_PROXY_CIDRS: ${ATOM_TRUSTED_PROXY_CIDRS:-}
      ATOM_GRAPHQL_INTROSPECTION_ENABLED: ${ATOM_GRAPHQL_INTROSPECTION_ENABLED:-false}
      ATOM_METRICS_ENABLED: ${ATOM_METRICS_ENABLED:-true}
      ATOM_GRPC_TLS_CERT_PATH: ${ATOM_GRPC_TLS_CERT_PATH:-}
      ATOM_GRPC_TLS_KEY_PATH: ${ATOM_GRPC_TLS_KEY_PATH:-}
      ATOM_GRPC_TLS_CLIENT_CA_PATH: ${ATOM_GRPC_TLS_CLIENT_CA_PATH:-}
      ATOM_PKI_ENROLLMENT_ENABLED: ${ATOM_PKI_ENROLLMENT_ENABLED:-false}
      ATOM_PKI_ENROLLMENT_LISTEN_ADDR: 0.0.0.0:${ATOM_PKI_ENROLLMENT_PORT:-8443}
      ATOM_PKI_ENROLLMENT_TLS_CERT_PATH: ${ATOM_PKI_ENROLLMENT_TLS_CERT_PATH:-}
      ATOM_PKI_ENROLLMENT_TLS_KEY_PATH: ${ATOM_PKI_ENROLLMENT_TLS_KEY_PATH:-}
      ATOM_PKI_ENROLLMENT_ENTITY_RATE_LIMIT: ${ATOM_PKI_ENROLLMENT_ENTITY_RATE_LIMIT:-10}
      ATOM_PKI_ENROLLMENT_ENTITY_RATE_WINDOW_SECS: ${ATOM_PKI_ENROLLMENT_ENTITY_RATE_WINDOW_SECS:-60}
      ATOM_PKI_ENROLLMENT_TENANT_RATE_LIMIT: ${ATOM_PKI_ENROLLMENT_TENANT_RATE_LIMIT:-1000}
      ATOM_PKI_ENROLLMENT_TENANT_RATE_WINDOW_SECS: ${ATOM_PKI_ENROLLMENT_TENANT_RATE_WINDOW_SECS:-60}
      ATOM_PKI_ENROLLMENT_MAX_CSR_BYTES: ${ATOM_PKI_ENROLLMENT_MAX_CSR_BYTES:-65536}
      ATOM_PKI_ENROLLMENT_MAX_CONNECTIONS: ${ATOM_PKI_ENROLLMENT_MAX_CONNECTIONS:-256}
      ATOM_PKI_ENROLLMENT_TRUST_REFRESH_SECS: ${ATOM_PKI_ENROLLMENT_TRUST_REFRESH_SECS:-60}
      ATOM_PKI_LIFECYCLE_ENABLED: ${ATOM_PKI_LIFECYCLE_ENABLED:-false}
      ATOM_PKI_LIFECYCLE_INTERVAL_SECS: ${ATOM_PKI_LIFECYCLE_INTERVAL_SECS:-60}
      ATOM_PKI_LIFECYCLE_BATCH_SIZE: ${ATOM_PKI_LIFECYCLE_BATCH_SIZE:-250}
      ATOM_PKI_EXPIRY_WARNING_SECS: ${ATOM_PKI_EXPIRY_WARNING_SECS:-86400}
      ATOM_PKI_AUTHORITY_WARNING_SECS: ${ATOM_PKI_AUTHORITY_WARNING_SECS:-2592000}
      ATOM_PKI_GENERATED_KEY_ISSUANCE_ENABLED: ${ATOM_PKI_GENERATED_KEY_ISSUANCE_ENABLED:-false}
      ATOM_PKI_CA_KEY_BACKEND: ${ATOM_PKI_CA_KEY_BACKEND:-encrypted_database}
      ATOM_PKI_CA_KEY_ENCRYPTION_KEY: ${ATOM_PKI_CA_KEY_ENCRYPTION_KEY:-}
      ATOM_PKI_CA_KEY_ENCRYPTION_KEY_ID: ${ATOM_PKI_CA_KEY_ENCRYPTION_KEY_ID:-local:pki:v1}
      ATOM_PKI_PKCS11_MODULE_PATH: ${ATOM_PKI_PKCS11_MODULE_PATH:-}
      ATOM_PKI_PKCS11_TOKEN_LABEL: ${ATOM_PKI_PKCS11_TOKEN_LABEL:-}
      ATOM_PKI_PKCS11_USER_PIN: ${ATOM_PKI_PKCS11_USER_PIN:-}
      ATOM_PKI_PKCS11_OPERATION_TIMEOUT_MS: ${ATOM_PKI_PKCS11_OPERATION_TIMEOUT_MS:-2000}
      ATOM_PKI_PKCS11_MAX_RETRIES: ${ATOM_PKI_PKCS11_MAX_RETRIES:-1}
      ATOM_PKI_PKCS11_MAX_IN_FLIGHT: ${ATOM_PKI_PKCS11_MAX_IN_FLIGHT:-8}
      ATOM_PKI_PKCS11_CIRCUIT_FAILURE_THRESHOLD: ${ATOM_PKI_PKCS11_CIRCUIT_FAILURE_THRESHOLD:-3}
      ATOM_PKI_PKCS11_CIRCUIT_RESET_SECS: ${ATOM_PKI_PKCS11_CIRCUIT_RESET_SECS:-30}
      ATOM_CERTS_ENABLED: ${ATOM_CERTS_ENABLED:-true}
      ATOM_CERTS_CA_MODE: ${ATOM_CERTS_CA_MODE:-file_intermediate_issuer}
      ATOM_CERTS_ROOT_CA_CERT_PATH: ${ATOM_CERTS_ROOT_CA_CERT_PATH:-/certs/root-ca.crt}
      ATOM_CERTS_INTERMEDIATE_CA_CERT_PATH: ${ATOM_CERTS_INTERMEDIATE_CA_CERT_PATH:-/certs/intermediate-ca.crt}
      ATOM_CERTS_INTERMEDIATE_CA_KEY_PATH: ${ATOM_CERTS_INTERMEDIATE_CA_KEY_PATH:-/certs/intermediate-ca.key}
      ATOM_CERTS_ROOT_CA_KEY_PATH: ${ATOM_CERTS_ROOT_CA_KEY_PATH:-}
      ATOM_CERTS_LEAF_DEFAULT_TTL_SECS: ${ATOM_CERTS_LEAF_DEFAULT_TTL_SECS:-2592000}
      ATOM_CERTS_LEAF_MAX_TTL_SECS: ${ATOM_CERTS_LEAF_MAX_TTL_SECS:-2592000}
      ATOM_MIN_PASSWORD_CHARS: ${ATOM_MIN_PASSWORD_CHARS:-12}
      ATOM_CORS_ALLOWED_ORIGINS: ${ATOM_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3005}
      ATOM_EMAIL_VERIFICATION_REDIRECT: ${ATOM_EMAIL_VERIFICATION_REDIRECT:-http://localhost:8080/auth/email/verify}
      ATOM_OAUTH_SUCCESS_REDIRECT: ${ATOM_OAUTH_SUCCESS_REDIRECT:-http://localhost:3005/auth/callback}
      ATOM_OAUTH_ERROR_REDIRECT: ${ATOM_OAUTH_ERROR_REDIRECT:-http://localhost:3005/auth/callback}
      ATOM_PASSWORD_RESET_REDIRECT: ${ATOM_PASSWORD_RESET_REDIRECT:-http://localhost:3005/reset-password}
      ATOM_INVITATION_REDIRECT: ${ATOM_INVITATION_REDIRECT:-http://localhost:3005/invitations/accept}
      ATOM_SELF_REGISTRATION_ENABLED: ${ATOM_SELF_REGISTRATION_ENABLED:-${ATOM_SIGNUP_ENABLED:-true}}
      ATOM_PUBLIC_BASE_URL: ${ATOM_PUBLIC_BASE_URL:-http://localhost:8080}
      ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN: "${ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN:-false}"
      ATOM_OIDC_PROVIDERS: ${ATOM_OIDC_PROVIDERS:-}
      ATOM_LOG_LEVEL: ${ATOM_LOG_LEVEL:-${RUST_LOG:-info}}
      ATOM_LOG_FORMAT: ${ATOM_LOG_FORMAT:-text}
      ATOM_EMAIL_TEMPLATES_DIR: ${ATOM_EMAIL_TEMPLATES_DIR:-/email-templates}
      # Demo bootstrap + callout wiring — see ./bootstrap.yaml and ./callout.yaml
      # in the repo root. Which host files get mounted is controlled by
      # ATOM_BOOTSTRAP_FILE / ATOM_CALLOUTS_FILE in .env (host paths). The
      # in-container path atom reads is always /etc/atom/... and is fixed
      # here — flipping the .env path swaps the source without changing what
      # atom looks for. Set ATOM_CALLOUTS_ENABLED=false in .env to kill-switch.
      ATOM_BOOTSTRAP_FILE: /etc/atom/bootstrap.yaml
      ATOM_CALLOUTS_FILE: /etc/atom/callout.yaml
      ATOM_CALLOUTS_ENABLED: ${ATOM_CALLOUTS_ENABLED:-true}
    volumes:
      - ${ATOM_CERTS_CA_DIR:-./certs}:/certs:ro
      - ${ATOM_EMAIL_TEMPLATES_HOST_DIR:-./email-templates}:/email-templates:ro
      - ${ATOM_BOOTSTRAP_FILE:-./bootstrap.yaml}:/etc/atom/bootstrap.yaml:ro
      - ${ATOM_CALLOUTS_FILE:-./callout.yaml}:/etc/atom/callout.yaml:ro
    ports:
      - "${ATOM_HTTP_PORT:-8080}:${ATOM_HTTP_PORT:-8080}"
      - "${ATOM_GRPC_PORT:-8081}:${ATOM_GRPC_PORT:-8081}"
      - "${ATOM_PKI_ENROLLMENT_PORT:-8443}:${ATOM_PKI_ENROLLMENT_PORT:-8443}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${ATOM_HTTP_PORT:-8080}/health/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - default

  atom-dev:
    image: ${ATOM_DEV_IMAGE:-ghcr.io/absmach/atom:dev}
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      callout-server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atom}:${POSTGRES_PASSWORD:-atom-dev-only}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-atom}
      LISTEN_ADDR: 0.0.0.0:${ATOM_DEV_HTTP_PORT:-8081}
      GRPC_ADDR: 0.0.0.0:${ATOM_DEV_GRPC_PORT:-18081}
      ATOM_DB_MAX_CONNECTIONS: ${ATOM_DB_MAX_CONNECTIONS:-20}
      ATOM_DB_MIN_CONNECTIONS: ${ATOM_DB_MIN_CONNECTIONS:-0}
      ATOM_DB_ACQUIRE_TIMEOUT_SECS: ${ATOM_DB_ACQUIRE_TIMEOUT_SECS:-30}
      ATOM_DB_CONNECT_TIMEOUT_SECS: ${ATOM_DB_CONNECT_TIMEOUT_SECS:-10}
      ATOM_DB_IDLE_TIMEOUT_SECS: ${ATOM_DB_IDLE_TIMEOUT_SECS:-600}
      ATOM_DB_MAX_LIFETIME_SECS: ${ATOM_DB_MAX_LIFETIME_SECS:-1800}
      JWT_EXPIRY_SECS: 3600
      ADMIN_SECRET: ${ADMIN_SECRET:-atom-dev-admin-password}
      ATOM_KEY_ENCRYPTION_KEY: ${ATOM_KEY_ENCRYPTION_KEY:-}
      ATOM_KEY_ENCRYPTION_KEY_ID: ${ATOM_KEY_ENCRYPTION_KEY_ID:-local:v1}
      ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS: ${ATOM_ALLOW_PLAINTEXT_SIGNING_KEYS:-true}
      ATOM_AUDIT_RETENTION_DAYS: ${ATOM_AUDIT_RETENTION_DAYS:-365}
      ATOM_AUDIT_RETENTION_ENABLED: ${ATOM_AUDIT_RETENTION_ENABLED:-true}
      ATOM_AUDIT_CLEANUP_INTERVAL_SECS: ${ATOM_AUDIT_CLEANUP_INTERVAL_SECS:-86400}
      ATOM_AUDIT_CLEANUP_BATCH_SIZE: ${ATOM_AUDIT_CLEANUP_BATCH_SIZE:-5000}
      ATOM_AUDIT_HOT_PATH_ALLOW_DB_ENABLED: ${ATOM_AUDIT_HOT_PATH_ALLOW_DB_ENABLED:-false}
      ATOM_EVENTS_AMQP_URL: ${ATOM_EVENTS_AMQP_URL:-}
      ATOM_EVENTS_AMQP_EXCHANGE: ${ATOM_EVENTS_AMQP_EXCHANGE:-}
      ATOM_EVENTS_AMQP_ROUTING_KEY: ${ATOM_EVENTS_AMQP_ROUTING_KEY:-atom.events}
      ATOM_EVENTS_AMQP_TLS_CLIENT_CERT_PATH: ${ATOM_EVENTS_AMQP_TLS_CLIENT_CERT_PATH:-}
      ATOM_EVENTS_AMQP_TLS_CLIENT_KEY_PATH: ${ATOM_EVENTS_AMQP_TLS_CLIENT_KEY_PATH:-}
      ATOM_EVENTS_AMQP_TLS_CA_PATH: ${ATOM_EVENTS_AMQP_TLS_CA_PATH:-}
      ATOM_EVENTS_OUTBOX_POLL_INTERVAL_SECS: ${ATOM_EVENTS_OUTBOX_POLL_INTERVAL_SECS:-5}
      ATOM_EVENTS_OUTBOX_BATCH_SIZE: ${ATOM_EVENTS_OUTBOX_BATCH_SIZE:-100}
      ATOM_EVENTS_OUTBOX_MAX_ATTEMPTS: ${ATOM_EVENTS_OUTBOX_MAX_ATTEMPTS:-10}
      ATOM_EVENTS_PUBLISH_TIMEOUT_SECS: ${ATOM_EVENTS_PUBLISH_TIMEOUT_SECS:-30}
      ATOM_LOGIN_FAILURE_LIMIT: ${ATOM_LOGIN_FAILURE_LIMIT:-5}
      ATOM_LOGIN_FAILURE_WINDOW_SECS: ${ATOM_LOGIN_FAILURE_WINDOW_SECS:-900}
      ATOM_TRUSTED_PROXY_CIDRS: ${ATOM_TRUSTED_PROXY_CIDRS:-}
      ATOM_GRAPHQL_INTROSPECTION_ENABLED: ${ATOM_GRAPHQL_INTROSPECTION_ENABLED:-true}
      ATOM_METRICS_ENABLED: ${ATOM_METRICS_ENABLED:-true}
      ATOM_GRPC_TLS_CERT_PATH: ${ATOM_GRPC_TLS_CERT_PATH:-}
      ATOM_GRPC_TLS_KEY_PATH: ${ATOM_GRPC_TLS_KEY_PATH:-}
      ATOM_GRPC_TLS_CLIENT_CA_PATH: ${ATOM_GRPC_TLS_CLIENT_CA_PATH:-}
      ATOM_PKI_ENROLLMENT_ENABLED: ${ATOM_PKI_ENROLLMENT_ENABLED:-false}
      ATOM_PKI_ENROLLMENT_LISTEN_ADDR: 0.0.0.0:${ATOM_DEV_PKI_ENROLLMENT_PORT:-18443}
      ATOM_PKI_ENROLLMENT_TLS_CERT_PATH: ${ATOM_PKI_ENROLLMENT_TLS_CERT_PATH:-}
      ATOM_PKI_ENROLLMENT_TLS_KEY_PATH: ${ATOM_PKI_ENROLLMENT_TLS_KEY_PATH:-}
      ATOM_PKI_ENROLLMENT_ENTITY_RATE_LIMIT: ${ATOM_PKI_ENROLLMENT_ENTITY_RATE_LIMIT:-10}
      ATOM_PKI_ENROLLMENT_ENTITY_RATE_WINDOW_SECS: ${ATOM_PKI_ENROLLMENT_ENTITY_RATE_WINDOW_SECS:-60}
      ATOM_PKI_ENROLLMENT_TENANT_RATE_LIMIT: ${ATOM_PKI_ENROLLMENT_TENANT_RATE_LIMIT:-1000}
      ATOM_PKI_ENROLLMENT_TENANT_RATE_WINDOW_SECS: ${ATOM_PKI_ENROLLMENT_TENANT_RATE_WINDOW_SECS:-60}
      ATOM_PKI_ENROLLMENT_MAX_CSR_BYTES: ${ATOM_PKI_ENROLLMENT_MAX_CSR_BYTES:-65536}
      ATOM_PKI_ENROLLMENT_MAX_CONNECTIONS: ${ATOM_PKI_ENROLLMENT_MAX_CONNECTIONS:-256}
      ATOM_PKI_ENROLLMENT_TRUST_REFRESH_SECS: ${ATOM_PKI_ENROLLMENT_TRUST_REFRESH_SECS:-60}
      ATOM_PKI_LIFECYCLE_ENABLED: ${ATOM_PKI_LIFECYCLE_ENABLED:-false}
      ATOM_PKI_LIFECYCLE_INTERVAL_SECS: ${ATOM_PKI_LIFECYCLE_INTERVAL_SECS:-60}
      ATOM_PKI_LIFECYCLE_BATCH_SIZE: ${ATOM_PKI_LIFECYCLE_BATCH_SIZE:-250}
      ATOM_PKI_EXPIRY_WARNING_SECS: ${ATOM_PKI_EXPIRY_WARNING_SECS:-86400}
      ATOM_PKI_AUTHORITY_WARNING_SECS: ${ATOM_PKI_AUTHORITY_WARNING_SECS:-2592000}
      ATOM_PKI_GENERATED_KEY_ISSUANCE_ENABLED: ${ATOM_PKI_GENERATED_KEY_ISSUANCE_ENABLED:-false}
      ATOM_PKI_CA_KEY_BACKEND: ${ATOM_PKI_CA_KEY_BACKEND:-encrypted_database}
      ATOM_PKI_CA_KEY_ENCRYPTION_KEY: ${ATOM_PKI_CA_KEY_ENCRYPTION_KEY:-}
      ATOM_PKI_CA_KEY_ENCRYPTION_KEY_ID: ${ATOM_PKI_CA_KEY_ENCRYPTION_KEY_ID:-local:pki:v1}
      ATOM_PKI_PKCS11_MODULE_PATH: ${ATOM_PKI_PKCS11_MODULE_PATH:-}
      ATOM_PKI_PKCS11_TOKEN_LABEL: ${ATOM_PKI_PKCS11_TOKEN_LABEL:-}
      ATOM_PKI_PKCS11_USER_PIN: ${ATOM_PKI_PKCS11_USER_PIN:-}
      ATOM_PKI_PKCS11_OPERATION_TIMEOUT_MS: ${ATOM_PKI_PKCS11_OPERATION_TIMEOUT_MS:-2000}
      ATOM_PKI_PKCS11_MAX_RETRIES: ${ATOM_PKI_PKCS11_MAX_RETRIES:-1}
      ATOM_PKI_PKCS11_MAX_IN_FLIGHT: ${ATOM_PKI_PKCS11_MAX_IN_FLIGHT:-8}
      ATOM_PKI_PKCS11_CIRCUIT_FAILURE_THRESHOLD: ${ATOM_PKI_PKCS11_CIRCUIT_FAILURE_THRESHOLD:-3}
      ATOM_PKI_PKCS11_CIRCUIT_RESET_SECS: ${ATOM_PKI_PKCS11_CIRCUIT_RESET_SECS:-30}
      ATOM_CERTS_ENABLED: ${ATOM_CERTS_ENABLED:-true}
      ATOM_CERTS_CA_MODE: ${ATOM_CERTS_CA_MODE:-file_intermediate_issuer}
      ATOM_CERTS_ROOT_CA_CERT_PATH: ${ATOM_CERTS_ROOT_CA_CERT_PATH:-/certs/root-ca.crt}
      ATOM_CERTS_INTERMEDIATE_CA_CERT_PATH: ${ATOM_CERTS_INTERMEDIATE_CA_CERT_PATH:-/certs/intermediate-ca.crt}
      ATOM_CERTS_INTERMEDIATE_CA_KEY_PATH: ${ATOM_CERTS_INTERMEDIATE_CA_KEY_PATH:-/certs/intermediate-ca.key}
      ATOM_CERTS_ROOT_CA_KEY_PATH: ${ATOM_CERTS_ROOT_CA_KEY_PATH:-}
      ATOM_CERTS_LEAF_DEFAULT_TTL_SECS: ${ATOM_CERTS_LEAF_DEFAULT_TTL_SECS:-2592000}
      ATOM_CERTS_LEAF_MAX_TTL_SECS: ${ATOM_CERTS_LEAF_MAX_TTL_SECS:-2592000}
      ATOM_MIN_PASSWORD_CHARS: ${ATOM_MIN_PASSWORD_CHARS:-12}
      ATOM_CORS_ALLOWED_ORIGINS: ${ATOM_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3005}
      ATOM_PUBLIC_BASE_URL: ${ATOM_PUBLIC_BASE_URL:-http://localhost:8081}
      ATOM_EMAIL_VERIFICATION_REDIRECT: ${ATOM_EMAIL_VERIFICATION_REDIRECT:-http://localhost:8081/auth/email/verify}
      ATOM_OAUTH_SUCCESS_REDIRECT: ${ATOM_OAUTH_SUCCESS_REDIRECT:-http://localhost:3005/auth/callback}
      ATOM_OAUTH_ERROR_REDIRECT: ${ATOM_OAUTH_ERROR_REDIRECT:-http://localhost:3005/auth/callback}
      ATOM_PASSWORD_RESET_REDIRECT: ${ATOM_PASSWORD_RESET_REDIRECT:-http://localhost:3005/reset-password}
      ATOM_INVITATION_REDIRECT: ${ATOM_INVITATION_REDIRECT:-http://localhost:3005/invitations/accept}
      ATOM_SELF_REGISTRATION_ENABLED: ${ATOM_SELF_REGISTRATION_ENABLED:-${ATOM_SIGNUP_ENABLED:-true}}
      ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN: "${ATOM_ALLOW_UNVERIFIED_EMAIL_LOGIN:-false}"
