    ports:
      - "${ATOM_DEV_HTTP_PORT:-8081}:${ATOM_DEV_HTTP_PORT:-8081}"
      - "${ATOM_DEV_GRPC_PORT:-18081}:${ATOM_DEV_GRPC_PORT:-18081}"
      - "${ATOM_DEV_PKI_ENROLLMENT_PORT:-18443}:${ATOM_DEV_PKI_ENROLLMENT_PORT:-18443}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${ATOM_DEV_HTTP_PORT:-8081}/health/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - dev

  atom-ui:
    image: ${ATOM_UI_IMAGE:-ghcr.io/absmach/atom-ui:latest}
    build:
      context: ./app
    depends_on:
      - atom
    environment:
      ATOM_GRAPHQL_URL: ${ATOM_GRAPHQL_URL:-http://atom:${ATOM_HTTP_PORT:-8080}/graphql}
      ATOM_UI_REGISTRATION_ENABLED: ${ATOM_UI_REGISTRATION_ENABLED:-true}
      ATOM_UI_FORWARD_CLIENT_IP_HEADERS: ${ATOM_UI_FORWARD_CLIENT_IP_HEADERS:-false}
      PORT: ${ATOM_UI_HTTP_PORT:-3005}
    ports:
      - "${ATOM_UI_HTTP_PORT:-3005}:${ATOM_UI_HTTP_PORT:-3005}"
    profiles:
      - atom-ui

  # Demo callout receiver — always ALLOWs and prints every request. See
  # scripts/simple-callout-server.py. Both `atom` and `atom-dev` depend on
  # this service so `docker compose up` + `docker compose --profile dev up`
  # both boot cleanly. Watch it with:
  #   docker compose logs -f callout-server
  callout-server:
    image: python:3-slim
    container_name: atom-callout-server
    working_dir: /app
    volumes:
      - ./scripts/simple-callout-server.py:/app/callout-server.py:ro
    command: ["python3", "-u", "callout-server.py"]
    environment:
      PORT: ${ATOM_CALLOUT_SERVER_PORT:-9099}
    # No published port by default — atom reaches it over the compose network
    # via the `callout-server` service name. Uncomment to curl from the host:
    # ports:
    #   - "${ATOM_CALLOUT_SERVER_PORT:-9099}:${ATOM_CALLOUT_SERVER_PORT:-9099}"
    profiles:
      - default
      - dev

volumes:
  postgres_data:
