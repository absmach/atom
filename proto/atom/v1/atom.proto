syntax = "proto3";

package atom.v1;

// Unless an RPC documents a narrower result, Atom uses these application error
// codes: INVALID_ARGUMENT for malformed input, invalid references, and stored
// check-constraint failures; NOT_FOUND for missing objects; UNAUTHENTICATED for
// invalid credentials; PERMISSION_DENIED for failed authorization;
// ALREADY_EXISTS for conflicts and unique-constraint failures;
// RESOURCE_EXHAUSTED for rate limits; UNAVAILABLE for dependency readiness;
// and INTERNAL for unexpected database or server failures.

// AuthzService evaluates authorization decisions.
// Call this on every request to protected downstream resources.
service AuthzService {
  // Requires authorization: Bearer <JWT-or-Atom-access-token> metadata. The
  // caller must hold authz.check for the target tenant or platform; the
  // subject being evaluated may be different from the caller.
  rpc Check(CheckRequest) returns (CheckResponse);
}

// AuthService validates tokens and delegated password/shared-key credentials.
// Use Authenticate to validate incoming tokens without decoding JWTs locally.
service AuthService {
  // Requires no authorization metadata. The credential being authenticated is
  // the token carried in the request body.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  // Requires authorization: Bearer <JWT-or-Atom-access-token> metadata. The
  // caller must hold authz.check for the selected tenant, or at platform scope
  // when no tenant is selected. The plaintext target credential stays in the
  // request body and is never treated as caller authentication.
  rpc AuthenticateCredential(AuthenticateCredentialRequest) returns (AuthenticateCredentialResponse);
}

// CertificateService resolves and revokes Atom certificate credentials for
// runtime services that terminate mTLS outside Atom.
service CertificateService {
  // ResolveCertificate was removed before v1; its RPC name is reserved by
  // contract and must not be reused. Consumers use ResolveCertificateV2.
  // Requires authorization: Bearer <JWT-or-Atom-access-token> metadata. The
  // caller must hold authz.check for the resolved tenant or platform.
  rpc ResolveCertificateV2(ResolveCertificateV2Request) returns (ResolveCertificateV2Response);
  // Requires authorization: Bearer <JWT-or-Atom-access-token> metadata. The
  // caller must hold manage on the target entity or its owning tenant.
  rpc RevokeEntityCertificates(RevokeEntityCertificatesRequest) returns (RevokeEntityCertificatesResponse);
}

// AliasService resolves human-friendly alias slugs to canonical UUIDs.
// Atom owns the alias registry and its uniqueness; callers (e.g. a message
// broker) resolve an alias once, cache the UUID, then authorize by UUID via
// AuthzService.Check. Resolution is capability-neutral — it reveals only the
// UUIDs; the Check call is the authorization gate.
service AliasService {
  // Requires authorization: Bearer <JWT-or-Atom-access-token> metadata. Alias
  // resolution itself has no capability gate; callers must authorize the
  // returned UUID separately with AuthzService.Check.
  rpc ResolveAlias(ResolveAliasRequest) returns (ResolveAliasResponse);
}

message CheckRequest {
  string subject_id  = 1;
  string action      = 2;  // capability name, e.g. "publish"
  // Legacy form: identifies a row in the `resources` table. Resolved with
  // kind = `resources.kind`. Mutually exclusive with object_kind/object_id;
  // if both are supplied, object_kind/object_id win.
  string resource_id = 3;
  // Optional ABAC context — flat string key/value pairs injected into the
  // evaluation context under the "context" key.
  // Note: only string values are supported over gRPC; use the GraphQL
  // authzCheck input when nested JSON context is required.
  map<string, string> context = 4;
  // Explicit form: identifies any first-class protected object.
  // resource, tenant, entity, group, role, policy, credential, and
  // api_endpoint require object_id.
  // platform requires object_id to be empty. Supplying the explicit form
  // takes precedence over the legacy resource_id field.
  string object_kind = 5;
  string object_id   = 6;
}

message CheckResponse {
  bool   allowed = 1;
  string reason  = 2;
}

message AuthenticateRequest {
  // JWT ("eyJ...") or API key ("atom_...") — same as the HTTP Bearer value.
  string token = 1;
}

message AuthenticateResponse {
  string entity_id  = 1;
  string tenant_id  = 2;  // empty string if entity has no tenant
  string session_id = 3;  // empty string for API key authentication
}

message AuthenticateCredentialRequest {
  // Username-style identifier supplied by protocol adapters. For password
  // credentials this may be an entity UUID, email, name, or a tenant-scoped
  // entity alias. For shared_key credentials this identifies the machine entity
  // whose key is being presented.
  string identifier   = 1;
  // Plaintext secret supplied by the caller. Atom stores an Argon2 verifier for
  // authentication. Retrievable shared keys also store an encrypted reveal copy
  // and a keyed lookup digest; plaintext is never stored.
  string secret       = 2;
  // Supported values are "password" and "shared_key". Empty falls back to
  // "password" — the simplest auth model (basic username/secret).
  string kind         = 3;
  string tenant_id    = 4;
  string tenant_alias = 5;
}

message AuthenticateCredentialResponse {
  string entity_id     = 1;
  string tenant_id     = 2;
  string credential_id = 3;
}

// Unambiguous runtime resolution. At least one of certificate_der,
// fingerprint_sha256, or the issuer-fingerprint/serial pair is required. When
// multiple selectors are supplied they must all identify the same credential.
message ResolveCertificateV2Request {
  bytes certificate_der = 1;
  string fingerprint_sha256 = 2;
  string issuer_fingerprint_sha256 = 3;
  string serial_number = 4;
  // Optional tenant binding. Empty means no expected tenant; a global entity
  // still resolves with an empty tenant_id and never acquires tenant scope.
  string expected_tenant_id = 5;
}

message ResolveCertificateV2Response {
  string entity_id = 1;
  string tenant_id = 2;
  string credential_id = 3;
  string issuer_id = 4;
  string expires_at = 5;
  string status = 6;
}

message RevokeEntityCertificatesRequest {
  string entity_id = 1;
  string reason = 2;
}

message RevokeEntityCertificatesResponse {
  uint64 revoked = 1;
}

message ResolveAliasRequest {
  // Tenant selector — exactly one of tenant_id, tenant_alias, or global must
  // be set. tenant_alias is the case-folded tenant slug.
  string tenant_id    = 1;
  string tenant_alias = 2;
  // Which table the object alias addresses: "entity" (clients/devices) or
  // "resource" (channels). Other values are rejected. Generic on purpose —
  // no domain/channel vocabulary.
  string object_kind  = 3;
  // The object's alias slug, unique within the tenant.
  string object_alias = 4;
  // Resolve an entity or resource whose tenant_id is NULL.
  bool global = 5;
}

message ResolveAliasResponse {
  string tenant_id = 1; // empty string for global objects
  string object_id = 2;
}
