name: API Docs

on:
  push:
    branches: [main]
    paths:
      - "proto/**"
      - "apidocs/**"
      - "api/v1/**"
      - "examples/export-graphql-schema.rs"
      - "scripts/check-v1-contracts.sh"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/apidocs.yml"
  pull_request:
    branches: [main, certificates]

jobs:
  proto:
    name: Lint proto + check generated docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      - name: Install Go (for protoc-gen-doc)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install protoc-gen-doc
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

      - name: Generate proto docs
        run: buf generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code apidocs/grpc-reference.md; then
            echo ""
            echo "apidocs/grpc-reference.md is out of date."
            echo "Run 'buf generate' locally and commit the result."
            exit 1
          fi

  openapi:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Validate openapi.yaml
        run: redocly lint apidocs/openapi.yaml

  frozen-contracts:
    name: Check GraphQL, migrations, and v1 freeze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Check generated GraphQL SDL
        run: |
          schema_file="$(mktemp)"
          cargo run --locked --quiet --example export-graphql-schema -- "$schema_file"
          diff -u apidocs/graphql-schema.graphql "$schema_file"

      - name: Check v1 API and migration contracts
        run: bash scripts/check-v1-contracts.sh
