name: PKI Release

on:
  pull_request:
    branches: [main, certificates]

permissions:
  contents: read

concurrency:
  group: pki-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: real PKI smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom
          POSTGRES_DB: atom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL, OpenSSL, and protoc clients
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssl protobuf-compiler

      - name: Install independent EST interoperability client
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build pinned GlobalSign EST client
        run: |
          set -euo pipefail
          go install github.com/globalsign/est/cmd/estclient@v1.0.7
          echo "ATOM_EST_CLIENT=$(go env GOPATH)/bin/estclient" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run real PKI smoke test
        env:
          PKI_TEST_MAINT_URL: postgres://atom:atom@localhost:5432/atom
          PKI_TEST_DATABASE_URL: postgres://atom:atom@localhost:5432/atom_pki_test
          PKI_TEST_DATABASE_NAME: atom_pki_test
          RUST_BACKTRACE: '1'
        run: ./scripts/pki-test.sh smoke

