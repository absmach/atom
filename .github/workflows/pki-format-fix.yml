name: Format PKI correction

on:
  push:
    branches:
      - feat/atom-native-multitenant-pki

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atom-native-multitenant-pki
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/certs/authority/mod.rs src/certs/authority/repo.rs tests/m29_pki_authorities.rs
          git commit -m "Format PKI corrections"
          git push origin HEAD:feat/atom-native-multitenant-pki
