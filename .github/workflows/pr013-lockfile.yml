name: PR-013 lockfile bootstrap

on:
  push:
    branches: [pki/pr-013-hsm-kms-support]
    paths: [Cargo.toml]

permissions:
  contents: write

jobs:
  lock-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pki/pr-013-hsm-kms-support
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate and publish lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build(pki): update Rust lockfile for PKCS#11'
            git push origin HEAD:pki/pr-013-hsm-kms-support
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --tests --locked
