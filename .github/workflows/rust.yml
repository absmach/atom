name: Rust

on:
  pull_request:
    branches: [main, certificates]
  # Pushes to main and release tags run this through the image workflow, which
  # gates publishing on it. Keeping a separate push trigger here would just run
  # the same job twice for every one of those events.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom
          POSTGRES_DB: atom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Provision disposable SoftHSM PKCS#11 token
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client softhsm2
          PKCS11_ROOT=/tmp/atom-softhsm
          TOKEN_DIR="$PKCS11_ROOT/tokens"
          mkdir -p "$TOKEN_DIR"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' "$TOKEN_DIR" > "$PKCS11_ROOT/softhsm2.conf"
          export SOFTHSM2_CONF="$PKCS11_ROOT/softhsm2.conf"
          softhsm2-util --init-token --free --label atom-pki-ci --so-pin 12345678 --pin 123456
          MODULE_PATH="$(dpkg -L libsofthsm2 | awk '/libsofthsm2[.]so$/{print; exit}')"
          test -n "$MODULE_PATH"
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "ATOM_PKI_PKCS11_MODULE_PATH=$MODULE_PATH"
            echo "ATOM_PKI_PKCS11_TOKEN_LABEL=atom-pki-ci"
            echo "ATOM_PKI_PKCS11_USER_PIN=123456"
          } >> "$GITHUB_ENV"

      - name: Install independent EST interoperability client
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build pinned GlobalSign EST client
        run: |
          go install github.com/globalsign/est/cmd/estclient@v1.0.7
          echo "ATOM_EST_CLIENT=$(go env GOPATH)/bin/estclient" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Atom implements a proto it does not own, and nothing rebuilds the
      # vendored copy. Without this, an upstream change surfaces at runtime.
      - name: Vendored proto matches upstream
        run: scripts/check-vendored-proto.sh

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

      - name: Compile tests
        run: cargo test --no-run --locked

      # The DB-gated tests (#[ignore]) need Postgres. They share global rows
      # (the seeded admin, tenants, roles) and some assert on listings, so they
      # are not isolated enough to share one database across binaries running in
      # parallel. Run each test binary against its own freshly-created database,
      # single-threaded, so every binary starts from a clean migrated schema.
      - name: Run tests (each binary against a fresh database)
        env:
          PGPASSWORD: atom
          MAINT_URL: postgres://atom:atom@localhost:5432/atom
        run: |
          set -euo pipefail
          command -v psql >/dev/null || {
            sudo apt-get update && sudo apt-get install -y postgresql-client
          }
          psql "$MAINT_URL" -c "SELECT 1" >/dev/null
          run_one() {
            psql "$MAINT_URL" -c "DROP DATABASE IF EXISTS atom_test;" >/dev/null
            psql "$MAINT_URL" -c "CREATE DATABASE atom_test;" >/dev/null
            DATABASE_URL="postgres://atom:atom@localhost:5432/atom_test" \
              cargo test "$@" -- --include-ignored --test-threads=1
          }
          run_one --lib
          for f in tests/*.rs; do
            name="$(basename "$f" .rs)"
            # These two require a real AMQP broker reachable at test time (and,
            # for the mTLS one, a FluxMQ instance with pre-provisioned
            # local-principal certs) — infra this job doesn't provision, unlike
            # every other #[ignore]d test here which needs only the Postgres
            # service above. "Compile tests" still builds them, so they still
            # fail CI on a compile error; run them manually per their own
            # module docs when broker infra is available.
            case "$name" in
              m27_live_amqp_delivery|m28_amqp_mtls_local_principal|m42_pki_pkcs11) continue ;;
            esac
            run_one --test "$name"
          done
          # Leave the PKCS#11 integration database and populated token in place
          # for the recovery proof in the following step.
          run_one --test m42_pki_pkcs11

      - name: Exercise PKCS#11 backup recovery runbook
        run: |
          set -euo pipefail
          PKCS11_ROOT=/tmp/atom-softhsm
          cp -a "$PKCS11_ROOT/tokens" "$PKCS11_ROOT/tokens.backup"
          mv "$PKCS11_ROOT/tokens" "$PKCS11_ROOT/tokens.lost"
          test ! -e "$PKCS11_ROOT/tokens"
          cp -a "$PKCS11_ROOT/tokens.backup" "$PKCS11_ROOT/tokens"
          softhsm2-util --show-slots | grep -F 'atom-pki-ci'
          DATABASE_URL="postgres://atom:atom@localhost:5432/atom_test" \
            ATOM_PKI_PKCS11_RECOVERY_CHECK=1 \
            cargo test --test m42_pki_pkcs11 \
              softhsm_restored_backup_can_sign_with_existing_authority -- \
              --include-ignored --exact --test-threads=1
