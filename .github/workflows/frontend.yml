name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/frontend.yml"
  # Pushes to main and release tags run this through the image workflow, which
  # gates publishing on it. Keeping a separate push trigger here would just run
  # the same job twice for every one of those events.
  workflow_call:
  # Keeps the dependency audit running against main between pull requests.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.project }} lint / test / build / audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [app, docs]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v6

      # Version comes from the `packageManager` field. The path is explicit
      # because `defaults.run.working-directory` applies to `run` steps only,
      # and this repository has no package.json at its root.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.project }}/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint Atom UI
        if: matrix.project == 'app'
        run: pnpm lint

      - name: Test Atom UI
        if: matrix.project == 'app'
        run: pnpm test

      - name: Build
        run: pnpm build

      # Skipped on push, which is the path that publishes images: a CVE
      # disclosed after the code froze would otherwise block shipping an
      # already-tested tag. Pull requests and the weekly schedule still gate on
      # it, and `github.event_name` on a called workflow is the caller's event.
      - name: Audit production dependencies
        if: github.event_name != 'push'
        run: pnpm audit --prod --audit-level high
