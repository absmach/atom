name: Publish container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: publish-container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ATOM_IMAGE: ${{ github.repository_owner }}/atom
  ATOM_UI_IMAGE: ${{ github.repository_owner }}/atom-ui

jobs:
  # Publishing is gated on the same suites that guard a pull request, so a tag
  # pushed straight to the repository cannot ship an untested image.
  rust:
    name: Rust
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  frontend:
    name: Frontend
    permissions:
      contents: read
    uses: ./.github/workflows/frontend.yml

  publish:
    name: Build and push container images
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history and tags so `git describe` matches what the Makefile
          # embeds locally.
          fetch-depth: 0

      # Same identity `make latest` / `make release` derive, so an image built
      # here and one built on a workstation report the same version string.
      - name: Resolve build version
        id: build_version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Atom
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: release
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ATOM_IMAGE }}:latest
            ${{ github.ref_type == 'tag' && format('{0}/{1}:{2}', env.REGISTRY, env.ATOM_IMAGE, github.ref_name) || '' }}
          build-args: |
            ATOM_VERSION=${{ steps.build_version.outputs.version }}
            ATOM_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atom
          cache-to: type=gha,mode=max,scope=atom

      - name: Build and push Atom UI
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ATOM_UI_IMAGE }}:latest
            ${{ github.ref_type == 'tag' && format('{0}/{1}:{2}', env.REGISTRY, env.ATOM_UI_IMAGE, github.ref_name) || '' }}
          build-args: |
            ATOM_VERSION=${{ steps.build_version.outputs.version }}
            ATOM_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atom-ui
          cache-to: type=gha,mode=max,scope=atom-ui
