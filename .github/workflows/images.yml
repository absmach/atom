name: Publish container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  # Every run below can move the same mutable `:latest` tags. Serialize branch
  # and tag events so their pushes cannot race each other.
  group: publish-container-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ATOM_IMAGE: ${{ github.repository_owner }}/atom
  ATOM_UI_IMAGE: ${{ github.repository_owner }}/atom-ui

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        if: github.ref_type == 'tag'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        if: github.ref_type == 'tag'
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Install Buf
        if: github.ref_type == 'tag'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.50.1"
          setup_only: true

      - name: Apply local release guard
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-check RELEASE_TAG="$RELEASE_TAG"

  # Publishing is gated on the same suites that guard a pull request, so a tag
  # pushed straight to the repository cannot ship an untested image.
  rust:
    name: Rust
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  frontend:
    name: Frontend
    permissions:
      contents: read
    uses: ./.github/workflows/frontend.yml

  contracts:
    name: API and persistence contracts
    permissions:
      contents: read
    uses: ./.github/workflows/apidocs.yml

  publish:
    name: Build and push container images
    runs-on: ubuntu-latest
    needs: [validate-release-tag, rust, frontend, contracts]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history and tags so `git describe` matches what the Makefile
          # embeds locally.
          fetch-depth: 0

      # Same identity `make latest` / `make release` derive, so an image built
      # here and one built on a workstation report the same version string.
      - name: Resolve build version
        id: build_version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Atom
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: release
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ATOM_IMAGE }}:latest
            ${{ github.ref_type == 'tag' && format('{0}/{1}:{2}', env.REGISTRY, env.ATOM_IMAGE, github.ref_name) || '' }}
          build-args: |
            ATOM_VERSION=${{ steps.build_version.outputs.version }}
            ATOM_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atom
          cache-to: type=gha,mode=max,scope=atom

      - name: Build and push Atom UI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ATOM_UI_IMAGE }}:latest
            ${{ github.ref_type == 'tag' && format('{0}/{1}:{2}', env.REGISTRY, env.ATOM_UI_IMAGE, github.ref_name) || '' }}
          build-args: |
            ATOM_VERSION=${{ steps.build_version.outputs.version }}
            ATOM_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=atom-ui
          cache-to: type=gha,mode=max,scope=atom-ui
